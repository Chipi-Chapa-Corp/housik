services:
  housik:
    image: housik:local
    build:
      context: .
      dockerfile: Containerfile
    init: true
    restart: unless-stopped
    ports:
      - '${HOUSIK_BIND:-127.0.0.1}:${HOUSIK_PORT:-4827}:3000'
    environment:
      ORIGIN: '${ORIGIN:-http://localhost:4827}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL: '${OPENAI_MODEL:-gpt-6.1-sol}'
      OPENAI_REASONING_EFFORT: '${OPENAI_REASONING_EFFORT-low}'
      OPENAI_INPUT_USD_PER_MILLION: '${OPENAI_INPUT_USD_PER_MILLION:-}'
      OPENAI_CACHED_INPUT_USD_PER_MILLION: '${OPENAI_CACHED_INPUT_USD_PER_MILLION:-}'
      OPENAI_CACHE_WRITE_USD_PER_MILLION: '${OPENAI_CACHE_WRITE_USD_PER_MILLION:-}'
      OPENAI_OUTPUT_USD_PER_MILLION: '${OPENAI_OUTPUT_USD_PER_MILLION:-}'
      OPENAI_RESPONSES_URL: '${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}'
      EXCHANGE_RATE_URL: '${EXCHANGE_RATE_URL:-}'
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "const response = await fetch('http://127.0.0.1:3000/'); if (!response.ok) process.exit(1);"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - housik_data:/app/data

volumes:
  housik_data:
