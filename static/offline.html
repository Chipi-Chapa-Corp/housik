<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f7" />
    <title>Offline · Housik</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f7f7;
        color: #343434;
        font:
          1rem / 1.5 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 380px);
        padding: 32px;
        border: 1px solid #e8e8e8;
        border-radius: 16px;
        background: #fff;
      }
      h1 {
        margin: 0;
        font-size: 1rem;
      }
      p {
        margin: 12px 0 24px;
        color: #4b5056;
      }
      a {
        display: inline-block;
        padding: 12px 17px;
        border-radius: 9px;
        background: #303842;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid #343434;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Connect to the internet to use Housik.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
